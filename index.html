<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регионы России — интерактивная карта</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Загружаем D3 с надежного Cloudflare -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>

  <header class="site-header">
    <h1>Регионы России</h1>
    <p>Нажмите на регион, чтобы узнать подробности</p>
  </header>

  <main class="map-wrap">
    <div id="map"></div>
  </main>

  <aside id="panel" class="panel hidden">
    <button id="close-panel" class="close-btn" aria-label="Закрыть">×</button>
    <div id="panel-content"></div>
  </aside>

  <div id="overlay" class="overlay hidden"></div>

  <!-- Ловушка для перехвата данных карты -->
  <script>
    window.echarts = {
      registerMap: function(name, data) {
        window.MAP_DATA = data;
      }
    };
  </script>
  <!-- Загружаем карту с надежного jsDelivr как JS-скрипт -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@4.9.0/map/js/russia.js"></script>
  
  <script src="data/regions.js"></script>
  <script src="script.js"></script>
</body>
</html>
